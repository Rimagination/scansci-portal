<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ScanSci | 学术工具门户</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=20260226d" />
  <link rel="stylesheet" href="./styles.css?v=20260227c" />
  <style>
    /* Critical fallback styles to avoid broken layout before stylesheet cache refresh */
    :root { --sidebar-width: 252px; }
    .portal-sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--sidebar-width);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 16px 14px;
      border-right: 1px solid #cdd7e5;
      background: linear-gradient(180deg, #f4f7fb 0%, #eef3fa 100%);
    }
    .sidebar-top { display: grid; gap: 8px; }
    .sidebar-categories { min-height: 0; flex: 1; overflow-y: auto; }
    .auth-dock { margin-top: auto; }
    .portal-main {
      margin-left: var(--sidebar-width);
      padding: 38px 24px 24px;
    }
    .brand-logo {
      display: block;
      width: min(100%, 182px);
      max-width: 100%;
      height: auto;
    }
    @media (max-width: 760px) {
      .portal-sidebar {
        position: static;
        width: auto;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid #cdd7e5;
        overflow: visible;
        padding: 16px;
      }
      .sidebar-categories { overflow: visible; }
      .portal-main {
        margin-left: 0;
        padding: 20px 16px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="portal-shell">
    <aside class="portal-sidebar">
      <div class="sidebar-top">
        <div class="brand-block">
          <img class="brand-logo" src="./assets/brand/scansci-logo.svg" alt="搜索科学 ScanSci" />
          <p class="brand-desc">统一入口，独立应用部署。</p>
        </div>

        <label class="search-label" for="globalSearch">全局搜索</label>
        <div class="global-search-wrap">
          <svg class="global-search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
          </svg>
          <input id="globalSearch" class="global-search" type="search" placeholder="搜索工具名或关键词" />
        </div>

        <div class="filter-head">
          <span>功能分类</span>
        </div>
      </div>

      <div class="sidebar-categories">
        <div id="categoryFilters" class="category-filters" role="tablist" aria-label="功能分类"></div>
      </div>

      <section id="authDock" class="auth-dock" aria-label="账户状态" hidden>
        <div id="userMiniCard" class="user-mini-card" hidden>
          <img id="userAvatar" class="user-mini-card__avatar" alt="用户头像" />
          <span id="userName" class="user-mini-card__name"></span>
          <div class="user-mini-card__actions">
            <button id="githubLinkBtn" class="user-mini-card__icon" type="button" hidden title="关联 GitHub" aria-label="关联 GitHub">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M9 8a4 4 0 0 1 7-2l1.5 1.5a4 4 0 0 1 0 5.7l-2.2 2.2a4 4 0 0 1-5.7 0 1 1 0 1 1 1.4-1.4 2 2 0 0 0 2.9 0l2.2-2.2a2 2 0 0 0 0-2.9L14.6 7.4a2 2 0 1 0-2.9 2.9 1 1 0 1 1-1.4 1.4A4 4 0 0 1 9 8z"></path>
                <path d="M15 16a4 4 0 0 1-7 2l-1.5-1.5a4 4 0 0 1 0-5.7l2.2-2.2a4 4 0 0 1 5.7 0 1 1 0 1 1-1.4 1.4 2 2 0 0 0-2.9 0L7.9 12.2a2 2 0 0 0 0 2.9l1.5 1.5a2 2 0 1 0 2.9-2.9 1 1 0 0 1 1.4-1.4A4 4 0 0 1 15 16z"></path>
              </svg>
            </button>
            <button id="logoutBtn" class="user-mini-card__icon" type="button" title="退出登录" aria-label="退出登录">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M13 3a1 1 0 0 1 0 2H7v14h6a1 1 0 1 1 0 2H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h7z"></path>
                <path d="M15.3 7.3a1 1 0 0 1 1.4 0l4.3 4.3a1 1 0 0 1 0 1.4l-4.3 4.3a1 1 0 1 1-1.4-1.4L18.9 13H10a1 1 0 1 1 0-2h8.9l-3.6-3.6a1 1 0 0 1 0-1.4z"></path>
              </svg>
            </button>
          </div>
        </div>
      </section>
    </aside>

    <main class="portal-main">
      <header class="main-head">
        <p id="toolCount">加载中...</p>
      </header>

      <section id="toolGrid" class="tool-grid" aria-live="polite"></section>
      <p id="emptyState" class="empty-state" hidden>未找到匹配应用，请调整关键词或分类。</p>
      <p id="errorState" class="error-state" hidden>应用列表加载失败，请稍后重试。</p>
    </main>
  </div>

  <div id="authModal" class="auth-modal" hidden>
    <div class="auth-modal__backdrop" data-auth-close="true"></div>
    <section class="auth-modal__panel" role="dialog" aria-modal="true" aria-labelledby="authModalTitle">
      <button id="closeAuthModalBtn" class="auth-modal__close" type="button" aria-label="关闭登录窗口">×</button>
      <h3 id="authModalTitle" class="auth-modal__title">登录 / 注册</h3>
      <p class="auth-modal__subtitle">使用 GitHub 或邮箱验证码登录 ScanSci。</p>

      <div id="authGuest" class="auth-state">
        <button id="loginBtn" class="auth-btn auth-btn--primary" type="button">GitHub 登录/注册</button>
        <p class="auth-divider"><span>或邮箱验证码</span></p>
        <input id="emailInput" class="auth-input" type="email" placeholder="输入邮箱地址" autocomplete="email" />
        <div class="auth-code-row">
          <input id="emailCodeInput" class="auth-input" type="text" inputmode="numeric" maxlength="6" placeholder="输入6位验证码" />
          <button id="sendCodeBtn" class="auth-btn auth-btn--ghost" type="button">发送验证码</button>
        </div>
        <button id="emailLoginBtn" class="auth-btn auth-btn--secondary" type="button">邮箱登录/注册</button>
        <p id="authHint" class="auth-hint" hidden></p>
      </div>
    </section>
  </div>

  <script src="./app.js?v=20260227c"></script>
</body>
</html>
