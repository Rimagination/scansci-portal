name = "scansci-api"
main = "src/index.js"
compatibility_date = "2026-02-26"
workers_dev = false

[vars]
PUBLIC_ORIGIN = "https://www.scansci.com"
GITHUB_OAUTH_SCOPE = "read:user user:email"
SESSION_TTL_SECONDS = "2592000"
EMAIL_CODE_TTL_SECONDS = "600"
EMAIL_CODE_MAX_ATTEMPTS = "5"
ALLOW_DEV_EMAIL_CODE = "0"

[[routes]]
pattern = "www.scansci.com/api/*"
zone_name = "scansci.com"

[[d1_databases]]
binding = "DB"
database_name = "scansci_auth"
database_id = "4ea255cf-6c0e-4bd5-bafb-16e6bfda7689"
