<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="汇总科研相关公开基准，找到适合研究任务的模型。">
  <title>科研模型榜 | ScanSci</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=20261029">
</head>
<body>
  <header class="topbar"><a class="brand" href="https://www.scansci.com/" aria-label="ScanSci 首页"><img class="scansci-mark" src="assets/scansci.png" alt=""><span>ScanSci <span class="brand-section">模型榜</span></span></a></header>
  <div class="layout">
    <main>
      <nav id="nav" aria-label="科研任务分类"></nav>
      <header class="page-heading"><h1 id="title">科研数据分析榜</h1></header>
      <div id="content"></div>
    </main>
  </div>
<script>
  (() => {
    const files = ['data.js', 'asta-data.js', 'chart-data.js', 'inspire-data.js', 'recent-data.js', 'overall-data.js', 'literature-extra-data.js', 'visual-extra-data.js', 'extended-data.js', 'update-status.js'];
    const refresh = Date.now();
    Promise.all(files.map(file => new Promise(resolve => {
      const script = document.createElement('script');
      script.src = `${file}?refresh=${refresh}`;
      script.onload = script.onerror = resolve;
      document.head.appendChild(script);
    }))).then(() => {
      const script = document.createElement('script');
      script.src = 'app.js?v=20261118-vals';
      document.body.appendChild(script);
    });
  })();
</script>
</body></html>
