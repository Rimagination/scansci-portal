<svg width="900" height="1350" viewBox="0 0 900 1350" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Paper Atlas Cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8f4ff"/>
      <stop offset="100%" stop-color="#f0ebff"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="900" height="1350" fill="url(#bg)"/>
  <rect x="90" y="120" width="720" height="1110" rx="24" fill="#ffffff" stroke="#e0d5ff"/>

  <!-- Graph Network -->
  <!-- Central Node -->
  <circle cx="450" cy="500" r="45" fill="url(#node)" opacity="0.9"/>
  <circle cx="450" cy="500" r="30" fill="#ffffff"/>
  <text x="450" y="508" fill="#6366f1" font-family="Manrope, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">P</text>

  <!-- Surrounding Nodes -->
  <circle cx="300" cy="380" r="25" fill="url(#node)" opacity="0.7"/>
  <circle cx="600" cy="380" r="25" fill="url(#node)" opacity="0.7"/>
  <circle cx="250" cy="550" r="25" fill="url(#node)" opacity="0.7"/>
  <circle cx="650" cy="550" r="25" fill="url(#node)" opacity="0.7"/>
  <circle cx="350" cy="680" r="25" fill="url(#node)" opacity="0.7"/>
  <circle cx="550" cy="680" r="25" fill="url(#node)" opacity="0.7"/>
  <circle cx="450" cy="750" r="25" fill="url(#node)" opacity="0.7"/>

  <!-- Edges (Connections) -->
  <g fill="none" stroke="url(#edge)" stroke-width="3" opacity="0.6">
    <path d="M420 475 L325 400"/>
    <path d="M480 475 L575 400"/>
    <path d="M425 525 L275 540"/>
    <path d="M475 525 L625 540"/>
    <path d="M430 540 L365 660"/>
    <path d="M470 540 L535 660"/>
    <path d="M450 545 L450 725"/>
    <path d="M325 405 L265 530"/>
    <path d="M575 405 L635 530"/>
    <path d="M325 405 L575 405"/>
    <path d="M265 530 L635 530"/>
    <path d="M365 660 L535 660"/>
    <path d="M535 660 L450 725"/>
    <path d="M365 660 L450 725"/>
  </g>

  <!-- Small nodes at edge intersections -->
  <circle cx="325" cy="405" r="12" fill="#8b5cf6" opacity="0.5"/>
  <circle cx="575" cy="405" r="12" fill="#8b5cf6" opacity="0.5"/>
  <circle cx="265" cy="530" r="12" fill="#8b5cf6" opacity="0.5"/>
  <circle cx="635" cy="530" r="12" fill="#8b5cf6" opacity="0.5"/>

  <!-- Title -->
  <text x="450" y="920" fill="#4c3f7a" font-family="Manrope, Arial, sans-serif" font-size="72" font-weight="800" text-anchor="middle">Paper Atlas</text>
  <text x="450" y="990" fill="#7c6f9f" font-family="Manrope, Arial, sans-serif" font-size="36" font-weight="500" text-anchor="middle">论文图谱探索工具</text>
</svg>
