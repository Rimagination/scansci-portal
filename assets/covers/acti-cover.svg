<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">ACTI academic personality cover</title>
  <desc id="desc">A clean academic personality type card with four color quadrants and research notes.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfcf8"/>
      <stop offset="1" stop-color="#e9f1eb"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1814"/>
      <stop offset="1" stop-color="#34453d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#1f2a23" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="900" height="600" fill="url(#paper)"/>
  <path d="M0 455c156-55 260-52 395 0 138 53 294 68 505-20v165H0z" fill="#dde8df"/>
  <path d="M0 0h900v600H0z" fill="none" stroke="#d4ddd3" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="114" y="84" width="672" height="432" rx="8" fill="#fff" stroke="#d9ded7"/>
    <rect x="114" y="84" width="672" height="72" rx="8" fill="#181612"/>
    <text x="152" y="130" fill="#fff" font-family="Georgia, 'Noto Serif SC', serif" font-size="38" font-weight="700" letter-spacing="9">ACTI</text>
    <text x="606" y="127" fill="#d99a2b" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="16" font-weight="700" letter-spacing="3">ACADEMIC TYPE</text>
    <g transform="translate(152 204)">
      <rect width="116" height="116" rx="8" fill="#6d3fa8"/>
      <rect x="132" width="116" height="116" rx="8" fill="#d45614"/>
      <rect y="132" width="116" height="116" rx="8" fill="#157a55"/>
      <rect x="132" y="132" width="116" height="116" rx="8" fill="#1a6fa8"/>
      <text x="58" y="69" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="30" font-weight="700">JR</text>
      <text x="190" y="69" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="30" font-weight="700">JF</text>
      <text x="58" y="201" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="30" font-weight="700">LR</text>
      <text x="190" y="201" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="30" font-weight="700">LF</text>
    </g>
    <g transform="translate(456 212)">
      <text fill="url(#ink)" font-family="'Noto Serif SC', Georgia, serif" font-size="34" font-weight="700">学术人格类型测试</text>
      <text y="54" fill="#68716a" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="19">卷躺 · 理感 · 独群 · 急缓</text>
      <line y1="92" x2="258" y2="92" stroke="#dfe5dc" stroke-width="3"/>
      <g fill="#68716a" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="17">
        <text y="136">20 题快速测评</text>
        <text y="174">16 种科研状态画像</text>
        <text y="212">结果页支持完整解析</text>
      </g>
    </g>
