<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">PaperDeck cover</title>
  <desc id="desc">Light editorial cover for the PaperDeck portal card.</desc>
  <defs>
    <linearGradient id="pd-bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#f7f3ea" />
      <stop offset="58%" stop-color="#eef3fb" />
      <stop offset="100%" stop-color="#e7eff9" />
    </linearGradient>
    <linearGradient id="pd-line" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#c7892f" />
      <stop offset="100%" stop-color="#e6c58d" />
    </linearGradient>
    <linearGradient id="pd-card-back" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#d9e5f6" />
      <stop offset="100%" stop-color="#b9cde7" />
    </linearGradient>
    <linearGradient id="pd-card-mid" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#d0def2" />
      <stop offset="100%" stop-color="#9fbbe0" />
    </linearGradient>
    <linearGradient id="pd-card-front" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfefe" />
      <stop offset="100%" stop-color="#edf3fb" />
    </linearGradient>
    <filter id="pd-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#60708a" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#pd-bg)" />
  <circle cx="188" cy="124" r="178" fill="#f6d49a" opacity="0.22" />
  <circle cx="1038" cy="148" r="218" fill="#d5e3f8" opacity="0.85" />
  <circle cx="1034" cy="564" r="222" fill="#f0d6b6" opacity="0.26" />

  <g filter="url(#pd-shadow)">
    <rect x="688" y="156" width="380" height="480" rx="26" fill="#9eb8d9" opacity="0.32" transform="rotate(-8 878 396)" />
    <rect x="694" y="160" width="380" height="480" rx="26" fill="url(#pd-card-back)" stroke="#9fb7d7" stroke-width="2" transform="rotate(-8 884 400)" />

    <rect x="708" y="152" width="380" height="480" rx="26" fill="#97b1d4" opacity="0.22" transform="rotate(-3 898 392)" />
    <rect x="714" y="156" width="380" height="480" rx="26" fill="url(#pd-card-mid)" stroke="#8ea9d1" stroke-width="2" transform="rotate(-3 904 396)" />

    <rect x="730" y="152" width="380" height="480" rx="26" fill="#95abc7" opacity="0.18" />
    <rect x="736" y="156" width="380" height="480" rx="26" fill="url(#pd-card-front)" stroke="#cad7e8" stroke-width="2" />
  </g>

  <rect x="764" y="186" width="324" height="7" rx="3.5" fill="#d39d48" />
  <rect x="764" y="210" width="228" height="5" rx="2.5" fill="#7b92b0" opacity="0.62" />
  <rect x="764" y="228" width="278" height="5" rx="2.5" fill="#8ea3bd" opacity="0.46" />
  <rect x="764" y="246" width="194" height="5" rx="2.5" fill="#a5b4c7" opacity="0.38" />

  <rect x="764" y="286" width="324" height="126" rx="16" fill="#f5f8fd" stroke="#d5dfeb" stroke-width="2" />
  <rect x="786" y="306" width="176" height="5" rx="2.5" fill="#556b87" opacity="0.56" />
