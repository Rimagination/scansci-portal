  <text x="80" y="286" fill="#4e647c" font-family="Manrope, 'Noto Sans SC', sans-serif" font-size="22">Memory-driven paper discovery, now in a lighter portal card.</text>

  <rect x="80" y="320" width="138" height="36" rx="12" fill="#ffffff" stroke="#d7dfeb" stroke-width="1.5" />
  <text x="149" y="343" text-anchor="middle" fill="#31567a" font-family="Manrope, 'Noto Sans SC', sans-serif" font-size="15" font-weight="700">Profile</text>

  <rect x="230" y="320" width="138" height="36" rx="12" fill="#fff4e2" stroke="#efd29f" stroke-width="1.5" />
  <text x="299" y="343" text-anchor="middle" fill="#9a6a21" font-family="Manrope, 'Noto Sans SC', sans-serif" font-size="15" font-weight="700">Draw</text>

  <rect x="380" y="320" width="138" height="36" rx="12" fill="#edf6ef" stroke="#bfd7c4" stroke-width="1.5" />
  <text x="449" y="343" text-anchor="middle" fill="#3a7251" font-family="Manrope, 'Noto Sans SC', sans-serif" font-size="15" font-weight="700">Collect</text>

  <path d="M80 392h362" stroke="#ccb48e" stroke-opacity="0.5" stroke-width="1.5" />
  <rect x="80" y="418" width="418" height="5" rx="2.5" fill="#a9b6c6" opacity="0.24" />
  <rect x="80" y="436" width="348" height="5" rx="2.5" fill="#aeb9c8" opacity="0.16" />
  <rect x="80" y="454" width="386" height="5" rx="2.5" fill="#b9c3d1" opacity="0.12" />
  <rect x="80" y="472" width="278" height="5" rx="2.5" fill="#c6ced8" opacity="0.1" />

  <text x="80" y="618" fill="#72859a" font-family="Manrope, 'Noto Sans SC', sans-serif" font-size="16">Powered by Semantic Scholar and OpenAlex</text>
