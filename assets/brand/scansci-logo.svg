<svg width="980" height="320" viewBox="0 0 980 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="搜索科学 ScanSci">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#184e95"/>
      <stop offset="100%" stop-color="#0f2f66"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

  <rect width="980" height="320" fill="transparent"/>

  <g transform="translate(30,26)">
    <circle cx="130" cy="130" r="107" fill="#ffffff" stroke="url(#ring)" stroke-width="16"/>
    <circle cx="130" cy="130" r="93" fill="none" stroke="#153a77" stroke-width="4" opacity="0.9"/>
    <rect x="200" y="192" width="64" height="96" rx="30" transform="rotate(-45 200 192)" fill="#113a74"/>

    <line x1="74" y1="166" x2="122" y2="98" stroke="#c6c9cf" stroke-width="8" stroke-linecap="round"/>
    <line x1="122" y1="98" x2="163" y2="146" stroke="#c6c9cf" stroke-width="8" stroke-linecap="round"/>
    <line x1="163" y1="146" x2="212" y2="86" stroke="#c6c9cf" stroke-width="8" stroke-linecap="round"/>

    <circle cx="74" cy="166" r="20" fill="#1e68df"/>
    <circle cx="122" cy="98" r="20" fill="#16a36a"/>
    <circle cx="163" cy="146" r="20" fill="#15a26f"/>
    <circle cx="212" cy="86" r="20" fill="#dda43b"/>
  </g>

  <g transform="translate(352,34)">
    <text x="0" y="118" fill="#203548" font-family="Noto Sans SC, Arial, sans-serif" font-size="116" font-weight="800" letter-spacing="1">搜索科学</text>
    <text x="2" y="246" fill="#25384a" font-family="Manrope, Arial, sans-serif" font-size="132" font-weight="800" filter="url(#soft)">ScanSci</text>
