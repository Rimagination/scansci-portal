name: Elsevier Cache Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Sync Elsevier cache to Cloudflare Worker (D1)
        env:
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          SCANSCI_ADMIN_SYNC_TOKEN: ${{ secrets.SCANSCI_ADMIN_SYNC_TOKEN }}
          SCANSCI_WORKER_BASE: "https://www.scansci.com"
          ISSN_SOURCE_URL: "https://www.scansci.com/api/admin/journal-search/issns?limit=800"
          ISSN_LIMIT: "800"
          PRIORITY_ISSN: "0378-3774,1873-2283,0028-0836,1476-4687,2210-6707,2210-6715"
          FAIL_ON_PRIORITY_MISS: "1"
          CONCURRENCY: "6"
          REQUESTS_PER_SECOND: "4"
          BATCH_SIZE: "25"
          TTL_SECONDS: "2592000"
          ISSN_ROTATION_TOTAL: "22799"
          ISSN_ROTATION_HOURS: "12"
          REQUEST_TIMEOUT_MS: "12000"
        run: node worker/scripts/sync_elsevier_cache.mjs
