<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">ScanSci Skills cover</title>
  <desc id="desc">Light editorial cover for the ScanSci Skills portal card.</desc>
  <defs>
    <linearGradient id="ss-bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#f7f3eb" />
      <stop offset="55%" stop-color="#edf5ef" />
      <stop offset="100%" stop-color="#e6f0f8" />
    </linearGradient>
    <linearGradient id="ss-accent" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#c87d42" />
      <stop offset="100%" stop-color="#e0b26a" />
    </linearGradient>
    <filter id="ss-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#526779" flood-opacity="0.16" />
    </filter>
  </defs>

  <rect width="1200" height="720" rx="40" fill="url(#ss-bg)" />
  <circle cx="196" cy="150" r="174" fill="#f4d4b8" opacity="0.6" />
  <circle cx="1038" cy="118" r="198" fill="#d8e8d6" opacity="0.92" />
  <circle cx="976" cy="594" r="210" fill="#dbe6f5" opacity="0.88" />

  <rect x="76" y="86" width="1048" height="548" rx="32" fill="#ffffff" opacity="0.34" />
  <path d="M150 206h362" stroke="url(#ss-accent)" stroke-width="16" stroke-linecap="round" />
  <path d="M150 248h246" stroke="#7f8f81" stroke-opacity="0.44" stroke-width="10" stroke-linecap="round" />

  <g filter="url(#ss-shadow)">
    <rect x="676" y="138" width="370" height="370" rx="34" fill="#ffffff" opacity="0.9" stroke="#d4dfd7" stroke-width="2" />
    <rect x="710" y="172" width="130" height="130" rx="28" fill="#f3f7ee" stroke="#d5e1d4" stroke-width="2" />
    <circle cx="776" cy="238" r="44" fill="none" stroke="#d39b52" stroke-width="14" />
    <path d="M806 270l48 48" stroke="#c67944" stroke-width="16" stroke-linecap="round" />

    <rect x="870" y="172" width="140" height="52" rx="16" fill="#fff5e7" stroke="#ecd0a8" stroke-width="1.5" />
    <text x="940" y="205" text-anchor="middle" fill="#9e6c2f" font-family="Manrope, 'Noto Sans SC', sans-serif" font-size="18" font-weight="700">Discover</text>

    <rect x="870" y="238" width="140" height="52" rx="16" fill="#edf5ef" stroke="#c8dccd" stroke-width="1.5" />
    <text x="940" y="271" text-anchor="middle" fill="#3e7154" font-family="Manrope, 'Noto Sans SC', sans-serif" font-size="18" font-weight="700">Use</text>

    <rect x="710" y="332" width="300" height="126" rx="24" fill="#f7faf8" stroke="#d7e2db" stroke-width="2" />
    <path d="M742 366h180" stroke="#4d6a62" stroke-opacity="0.68" stroke-width="8" stroke-linecap="round" />
    <path d="M742 398h228" stroke="#8a9c90" stroke-opacity="0.48" stroke-width="8" stroke-linecap="round" />
    <path d="M742 430h156" stroke="#b0beb4" stroke-opacity="0.62" stroke-width="8" stroke-linecap="round" />
  </g>

  <g transform="translate(150 336)">
    <rect x="0" y="0" width="168" height="96" rx="22" fill="#ffffff" opacity="0.92" stroke="#dde4ea" stroke-width="1.5" />
    <rect x="188" y="0" width="168" height="96" rx="22" fill="#fff5e6" opacity="0.94" stroke="#ecd2aa" stroke-width="1.5" />
    <rect x="376" y="0" width="168" height="96" rx="22" fill="#edf5ef" opacity="0.94" stroke="#cbddd0" stroke-width="1.5" />
    <text x="24" y="38" fill="#26415c" font-family="Manrope, 'Noto Sans SC', sans-serif" font-size="20" font-weight="700">Literature</text>
    <text x="24" y="66" fill="#73859a" font-family="Manrope, 'Noto Sans SC', sans-serif" font-size="18">Review</text>
    <text x="212" y="38" fill="#93622a" font-family="Manrope, 'Noto Sans SC', sans-serif" font-size="20" font-weight="700">Data</text>
    <text x="212" y="66" fill="#b08659" font-family="Manrope, 'Noto Sans SC', sans-serif" font-size="18">Repro</text>
    <text x="400" y="38" fill="#355f47" font-family="Manrope, 'Noto Sans SC', sans-serif" font-size="20" font-weight="700">Writing</text>
    <text x="400" y="66" fill="#6d8d78" font-family="Manrope, 'Noto Sans SC', sans-serif" font-size="18">Submission</text>
  </g>

  <text x="150" y="548" fill="#18324a" font-family="Manrope, 'Noto Sans SC', sans-serif" font-size="56" font-weight="800" letter-spacing="-1">SCI Skills</text>
  <text x="150" y="592" fill="#5b7186" font-family="Manrope, 'Noto Sans SC', sans-serif" font-size="22">A lighter entry card for the research skill library.</text>
</svg>
