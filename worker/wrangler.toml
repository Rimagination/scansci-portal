name = "scansci-api"
main = "src/index.js"
compatibility_date = "2026-02-26"
workers_dev = false

[vars]
PUBLIC_ORIGIN = "https://www.scansci.com"
GITHUB_OAUTH_SCOPE = "read:user user:email"
SESSION_TTL_SECONDS = "2592000"
EMAIL_CODE_TTL_SECONDS = "600"
EMAIL_CODE_MAX_ATTEMPTS = "5"
ALLOW_DEV_EMAIL_CODE = "0"
CORS_ORIGINS = "https://www.scansci.com,https://journal.scansci.com,https://dataset.scansci.com,https://citation.scansci.com"
ELSEVIER_SECONDARY_PROXY_BASE = ""
ELSEVIER_SECONDARY_FIRST = "0"
ELSEVIER_UPSTREAM_TIMEOUT_MS = "3500"
ELSEVIER_CACHE_TTL_SECONDS = "604800"
ELSEVIER_CACHE_STALE_SECONDS = "2592000"
CF_ZONE_ID = ""

[[routes]]
pattern = "www.scansci.com/api/*"
zone_name = "scansci.com"

[[d1_databases]]
binding = "DB"
database_name = "scansci_auth"
database_id = "4ea255cf-6c0e-4bd5-bafb-16e6bfda7689"
