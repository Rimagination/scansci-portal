<body>
  <header class="site-header">
    <div class="brand"><a class="brand-origin" href="https://www.scansci.com/" aria-label="ScanSci 主站"><img src="assets/scansci-icon.png" alt="" width="30" height="30"><span class="brand-byline">ScanSci 出品</span></a><a class="brand-title" href="index.html"><strong>最野科研人</strong></a></div>
    <nav aria-label="主导航"><a href="posts.html">相关微信推送 ↗</a></nav>
  </header>

  <main>
    <section id="gallery" class="gallery-section" aria-labelledby="gallery-title">
      <h1 id="gallery-title" class="sr-only">最野科研人第二届作品</h1>
      <div class="gallery-controls">
        <nav class="edition-tabs" aria-label="选择届次"><a href="index.html">第一届</a><a href="season-two.html" aria-current="page">第二届</a></nav>
        <label class="search-box"><span class="sr-only">搜索姓名、机构或地点</span><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.7"></circle><path d="m16 16 5 5"></path></svg><input id="gallery-search" type="search" placeholder="搜索姓名、机构、地点" autocomplete="off"></label>
      </div>
      <div class="gallery-meta"><p id="result-count" role="status" aria-live="polite">正在读取影像档案…</p><p>点击作品浏览完整组图 · 登录后可点赞</p></div>
      <div id="featured-section" class="featured-section" hidden><div class="section-label featured-label">精选 <span>EDITOR'S PICK</span></div><div id="featured-grid" class="featured-grid"></div></div>
      <div id="gallery-grid" class="gallery-grid"></div>

  <footer class="site-footer"><span>最野科研人 / WILD RESEARCHERS</span><span>2026 第二届影像档案</span><a href="#gallery">回到图库 ↑</a></footer>

  <dialog id="photo-dialog" class="photo-dialog" aria-labelledby="dialog-title"><button id="dialog-close" class="dialog-close" type="button" aria-label="关闭作品详情">×</button><div class="dialog-layout"><div class="dialog-image-wrap"><div class="dialog-stage"><img id="dialog-image" alt=""><span id="dialog-featured" class="dialog-featured" hidden>精选</span><span id="dialog-number" class="dialog-number"></span><span id="dialog-counter" class="dialog-counter"></span><button id="dialog-prev" class="gallery-nav gallery-prev" type="button" aria-label="上一张照片">‹</button><button id="dialog-next" class="gallery-nav gallery-next" type="button" aria-label="下一张照片">›</button></div><div id="dialog-thumbs" class="dialog-thumbs" aria-label="本组照片"></div></div><div class="dialog-info"><p id="dialog-batch" class="eyebrow"></p><h2 id="dialog-title"></h2><p id="dialog-organization" class="dialog-organization"></p><div id="dialog-engagement" class="engagement dialog-engagement"></div><div class="dialog-meta"><div><small>时间</small><span id="dialog-time"></span></div><div><small>地点</small><span id="dialog-location"></span></div></div><p id="dialog-photo-note" class="dialog-photo-note"></p><div id="dialog-story" class="dialog-story"></div><a id="dialog-source" class="source-link" target="_blank" rel="noopener noreferrer" hidden>在微信原文查看作品 ↗</a></div></div></dialog>
  <dialog id="auth-dialog" class="auth-dialog" aria-labelledby="auth-title"><button id="auth-close" class="dialog-close" type="button" aria-label="关闭登录窗口">×</button><h2 id="auth-title">登录后点赞</h2><p>使用 ScanSci 账号，为喜欢的作品点个赞。</p><a id="github-login" class="github-login" href="#">使用 GitHub 登录</a><div class="auth-divider">或使用邮箱验证码</div><form id="email-login-form"><label>邮箱<input id="auth-email" type="email" autocomplete="email" required></label><button id="send-code" type="button">发送验证码</button><label>验证码<input id="auth-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required></label><button type="submit">邮箱登录</button></form><p id="auth-message" role="status" aria-live="polite"></p></dialog>
  <p id="like-notice" class="like-notice" role="status" aria-live="polite" hidden></p>

</html>
