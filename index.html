<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ScanSci | 学术工具门户</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=20260226d" />
  <link rel="stylesheet" href="./styles.css?v=20260226d" />
  <style>
    /* Critical fallback styles to avoid broken layout before stylesheet cache refresh */
    .portal-sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 280px;
      height: 100vh;
      overflow-y: auto;
      padding: 22px 18px;
      border-right: 1px solid #cdd7e5;
      background: linear-gradient(180deg, #f4f7fb 0%, #eef3fa 100%);
    }
    .portal-main {
      margin-left: 280px;
      padding: 38px 24px 24px;
    }
    .brand-logo {
      display: block;
      width: min(100%, 260px);
      max-width: 100%;
      height: auto;
    }
    @media (max-width: 760px) {
      .portal-sidebar {
        position: static;
        width: auto;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid #cdd7e5;
        padding: 16px;
      }
      .portal-main {
        margin-left: 0;
        padding: 20px 16px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="portal-shell">
    <aside class="portal-sidebar">
      <div class="brand-block">
        <img class="brand-logo" src="./assets/brand/scansci-logo.svg" alt="搜索科学 ScanSci" />
        <p class="brand-desc">统一入口，独立应用部署。</p>
      </div>

      <section class="auth-box" aria-label="账户状态">
        <div id="authGuest" class="auth-state">
          <p class="auth-title">账户</p>
          <p class="auth-subtitle">可选择 GitHub 或邮箱验证码注册/登录。</p>
          <button id="loginBtn" class="auth-btn auth-btn--primary" type="button">GitHub 登录/注册</button>
          <p class="auth-divider"><span>或使用邮箱验证码</span></p>
          <input id="emailInput" class="auth-input" type="email" placeholder="输入邮箱地址" autocomplete="email" />
          <div class="auth-code-row">
            <input id="emailCodeInput" class="auth-input" type="text" inputmode="numeric" maxlength="6" placeholder="输入6位验证码" />
            <button id="sendCodeBtn" class="auth-btn auth-btn--ghost" type="button">发送验证码</button>
          </div>
          <button id="emailLoginBtn" class="auth-btn auth-btn--secondary" type="button">邮箱登录/注册</button>
          <p id="authHint" class="auth-hint" hidden></p>
        </div>
        <div id="authUser" class="auth-state auth-state--user" hidden>
          <img id="userAvatar" class="auth-avatar" alt="用户头像" />
          <div class="auth-user-meta">
            <p id="userName" class="auth-name"></p>
            <p id="userEmail" class="auth-email"></p>
            <p id="userFlags" class="auth-flags"></p>
          </div>
          <div class="auth-user-actions">
            <button id="githubLinkBtn" class="auth-btn auth-btn--secondary" type="button" hidden>关联 GitHub</button>
            <button id="logoutBtn" class="auth-btn auth-btn--ghost" type="button">退出登录</button>
          </div>
        </div>
      </section>

      <label class="search-label" for="globalSearch">全局搜索</label>
      <div class="global-search-wrap">
        <svg class="global-search-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
        </svg>
        <input id="globalSearch" class="global-search" type="search" placeholder="搜索工具名或关键词" />
      </div>

      <div class="filter-head">
        <span>功能分类</span>
      </div>
      <div id="categoryFilters" class="category-filters" role="tablist" aria-label="功能分类"></div>
    </aside>

    <main class="portal-main">
      <header class="main-head">
        <h2>ScanSci Apps</h2>
        <p id="toolCount">加载中...</p>
      </header>

      <section id="toolGrid" class="tool-grid" aria-live="polite"></section>
      <p id="emptyState" class="empty-state" hidden>未找到匹配应用，请调整关键词或分类。</p>
      <p id="errorState" class="error-state" hidden>应用列表加载失败，请稍后重试。</p>
    </main>
  </div>

  <script src="./app.js?v=20260226e"></script>
</body>
</html>
