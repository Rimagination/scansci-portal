name: Research model leaderboard refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * *'

permissions:
  contents: write
  pages: write

concurrency:
  group: research-model-leaderboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Arena snapshot reader
        run: python -m pip install pyarrow==25.0.0
      - name: Refresh independent sources
        id: refresh
        continue-on-error: true
        run: python -B model-rank/update_all.py
      - name: Publish successful snapshots and source status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add model-rank/data.js model-rank/asta-data.js model-rank/chart-data.js model-rank/inspire-data.js model-rank/recent-data.js model-rank/overall-data.js model-rank/update-status.js
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh research model leaderboard'
            git pull --rebase origin main
            git push origin HEAD:main
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          fi
      - name: Report source failures
        if: steps.refresh.outcome == 'failure'
        run: exit 1
