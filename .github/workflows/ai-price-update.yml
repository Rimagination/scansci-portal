name: AI price snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Refresh sourced prices
        run: node ai-prices/update-data.mjs
      - name: Validate snapshot
        run: node ai-prices/verify-data.mjs
      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-prices/data.json ai-prices/openai-config-snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh AI price snapshot"
            git push
          fi
